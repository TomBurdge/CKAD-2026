apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-job
  namespace: q02
spec:
  jobTemplate:
    metadata:
      name: backup-job
    spec:
      activeDeadlineSeconds: 300
      template:
        metadata: {}
        spec:
          containers:
          - image: busybox:latest
            name: backup-job
            resources: {}
            command: ["echo", "'Backup completed'"]
          restartPolicy: Never
  schedule: '*/30 * * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
status: {}
