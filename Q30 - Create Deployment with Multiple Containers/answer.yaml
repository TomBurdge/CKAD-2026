apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: multi-deploy
  name: multi-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: multi-deploy
    spec:
      containers:
      - image: nginx:latest
        name: web
        ports:
        - containerPort: 80
        resources: {}
      - image: busybox:latest
        name: metrics
        command: ["while true; do echo metrics; sleep 10; done"]
        resources: {}
status: {}
