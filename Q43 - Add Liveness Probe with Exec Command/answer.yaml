apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: liveness-exec-pod
  name: liveness-exec-pod
  namespace: q43
spec:
  containers:
  - image: busybox:latest
    command: ["/bin/sh", "-c", "touch /tmp/healthy; sleep 3600"]
    name: liveness-exec-pod
    resources: {}
    livenessProbe:
      exec:
        command:
        - cat 
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
