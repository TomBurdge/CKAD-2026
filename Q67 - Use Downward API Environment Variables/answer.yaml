apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: downward-env-pod
  name: downward-env-pod
  namespace: q67
spec:
  containers:
  - image: busybox:latest
    command: ["/bin/sh", "-c","echo POD_NAME=$POD_NAME POD_IP=$POD_IP NODE_NAME=$NODE_NAME; sleep 3600"]
    name: downward-env-pod
    resources: {}
    env:
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
